name: Update Obsidian Vault with Live Data

on:
  schedule:
    # Запуск каждый день в 9:00 MSK (06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Ручной запуск

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  update-obsidian:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 🎵 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🕷️ Parse Instagram Data
        run: npm run refresh:viral

      - name: 📊 Update Live Data Reports
        run: npm run update-live-data

      - name: 📤 Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vaults/
          git diff --staged --quiet || git commit -m "🤖 AUTO: Updated live data $(date '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: 📊 Summary
        run: echo "✅ Парсинг и обновление данных завершены успешно!"
