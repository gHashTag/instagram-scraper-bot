name: Update Obsidian Vault with Live Data

on:
  schedule:
    # Запуск каждый день в 9:00 MSK (06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:
    # Ручной запуск

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  update-obsidian:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🔧 Database Migration
        run: npm run db:migrate
        continue-on-error: true

      - name: 🕷️ Run Instagram Parsing (Viral Content)
        id: parsing
        run: |
          echo "🕷️ Запуск парсинга вирусного контента..."
          npm run refresh:viral
          echo "✅ Парсинг завершен"

      - name: 📊 Update Live Data
        id: update_data
        run: |
          echo "📊 Обновление live data из базы данных..."
          npm run update-live-data
          echo "✅ Live data обновлен"

      - name: 📤 Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Добавляем все изменения в vault
          git add vaults/

          # Проверяем есть ли изменения
          if git diff --staged --quiet; then
            echo "📝 Нет изменений для коммита"
          else
            git commit -m "🤖 Auto-update: Live data $(date '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Изменения отправлены в репозиторий"
          fi

      - name: 📊 Summary
        run: |
          echo "🎉 ПОЛНЫЙ ЦИКЛ ЗАВЕРШЕН!"
          echo "✅ Парсинг Instagram выполнен"
          echo "✅ Live data обновлен"
          echo "✅ Obsidian vault синхронизирован"
