name: Update Obsidian Vault with Live Data

on:
  schedule:
    # Запуск каждый день в 9:00 MSK (06:00 UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID to update (leave empty for all projects)"
        required: false
        default: "1"
        type: string

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  update-obsidian:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 🎵 Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🕷️ Parse Instagram (High-Viral Content)
        run: npm run refresh:viral
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: 📊 Update Live Data for All Projects
        run: |
          # Если указан конкретный project_id - обновляем только его
          if [ -n "${{ github.event.inputs.project_id }}" ]; then
            echo "🎯 Обновление проекта: ${{ github.event.inputs.project_id }}"
            npm run update-live-data ${{ github.event.inputs.project_id }}
          else
            echo "🗂️ Обновление всех активных проектов..."
            
            # Обновляем Project 1 (Coco Age)
            echo "📊 Обновление Project 1 (Coco Age)..."
            npm run update-live-data 1 || echo "⚠️ Ошибка обновления Project 1"
            
            # Обновляем Project 2 (Meta Muse)  
            echo "📊 Обновление Project 2 (Meta Muse)..."
            npm run update-live-data 2 || echo "⚠️ Ошибка обновления Project 2"
            
            echo "✅ Обновление всех проектов завершено"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OBSIDIAN_VAULT_PATH: ""

      - name: 📤 Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add vaults/
          if ! git diff --staged --quiet; then
            # Определяем сообщение коммита
            if [ -n "${{ github.event.inputs.project_id }}" ]; then
              COMMIT_MSG="🤖 AUTO: Updated live data for Project ${{ github.event.inputs.project_id }} - $(date '+%Y-%m-%d %H:%M UTC')"
            else
              COMMIT_MSG="🤖 AUTO: Updated live data for all projects - $(date '+%Y-%m-%d %H:%M UTC')"
            fi
            
            git commit -m "$COMMIT_MSG"
            
            # Простая стратегия: получаем remote и форсируем наш коммит
            git fetch origin main
            git reset --hard HEAD~1  # Откатываем наш коммит
            git pull origin main     # Получаем последние изменения
            git add vaults/          # Добавляем наши файлы поверх
            git commit -m "$COMMIT_MSG" || true
            git push origin main
          else
            echo "📝 Нет изменений для коммита"
          fi

      - name: 📊 Summary
        run: echo "✅ Парсинг и обновление данных завершены успешно!"
